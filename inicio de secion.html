</head><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Formulario - Registro e Inicio de Sesión</title>
    <style>
        :root {
            --fondo-pagina: #0b0b0b; /* Cambia este color o pon url('imagen.jpg') */
            --color-tarjeta: #ffc100;
        }

        body {
            background: var(--fondo-pagina);
            font-family: sans-serif;
            margin: 0;
            padding: 40px 20px;
            
            /* Centrado del formulario en pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        form {
            background-color: var(--color-tarjeta);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border-radius: 8px;
        }

        /* Espaciado simple para no encimar elementos */
        div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
        }
    </style>
</head>
<body>

    <form action="home.html" method="POST" enctype="multipart/form-data">
        <h2>Inicio De Secion</h2>

      <fieldset>
<div>
      <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="usuario@dominio.com" required>
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
</fieldset>
		        <div>
            <input type="submit" value="Ingresar">

        
</body>
</html>
